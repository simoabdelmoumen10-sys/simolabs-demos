<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIPAA &amp; GDPR Compliance Audit Studio — Live Interactive Demo | SimoLabs</title>
  <style>
    :root { --bg:#060a12; --panel:#0f172a; --line:#1e293b; --text:#f8fafc; --muted:#94a3b8; --cyan:#06b6d4; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,sans-serif; background:radial-gradient(circle at top,#082032,#060a12 58%); color:var(--text); padding:24px; min-height:100vh; }
    .wrap { max-width:1180px; margin:0 auto; }
    .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:24px; }
    .badge { display:inline-block; padding:5px 12px; border-radius:999px; background:rgba(6,182,212,.14); border:1px solid rgba(6,182,212,.38); color:#67e8f9; font-size:12px; font-weight:700; }
    h1 { margin:8px 0 4px; font-size:28px; }
    .sub { margin:0; color:var(--muted); font-size:14px; }
    .cta { padding:12px 20px; border-radius:12px; background:linear-gradient(135deg,#06b6d4,#3b82f6); color:#04111d; font-weight:800; text-decoration:none; font-size:14px; }
    .grid { display:grid; grid-template-columns:1.15fr .85fr; gap:20px; }
    @media (max-width:920px){ .grid{ grid-template-columns:1fr; } }
    .card { background:rgba(15,23,42,.9); border:1px solid var(--line); border-radius:18px; padding:20px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #334155; background:#090f1d; color:var(--text); font-size:14px; }
    .ctrl { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:#090f1d; border:1px solid #1e293b; margin-bottom:8px; cursor:pointer; }
    .ctrl input { width:18px; height:18px; margin-top:2px; accent-color:var(--cyan); }
    .tag { font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; background:#1e293b; color:#67e8f9; text-transform:uppercase; }
    .scorebox { text-align:center; padding:18px; border-radius:16px; background:#090f1d; border:1px solid #1e293b; margin-bottom:16px; }
    .scorenum { font-size:48px; font-weight:900; line-height:1; }
    .tier { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; }
    .barwrap { margin:10px 0; }
    .barlabel { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .bar { height:8px; background:#1e293b; border-radius:999px; overflow:hidden; }
    .bar > div { height:100%; background:linear-gradient(90deg,#06b6d4,#22c55e); transition:width .2s; }
    .btns { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
    button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; background:#1e293b; color:#f8fafc; }
    button.primary { background:var(--cyan); color:#04111d; }
    pre { background:#090f1d; border:1px solid #1e293b; border-radius:12px; padding:14px; font-size:12px; line-height:1.5; max-height:360px; overflow:auto; white-space:pre-wrap; color:#cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <span class="badge">SIMOLABS REBIRTH · RB-02 · 100% OFFLINE ENGINE</span>
        <h1>HIPAA &amp; GDPR Compliance Audit Studio</h1>
        <p class="sub">Weighted 15-control clinical &amp; B2B assessment with CFR/GDPR citations, 30/60/90 roadmap &amp; Policy Draft.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <a class="cta" href="https://buy.stripe.com/bJe14pa3M91N4XMgxz9bO0f" target="_blank" rel="noopener">Pay by Card (Stripe · $79) →</a>
        <a class="cta" style="background:transparent;border:1px solid #334155;color:#e2e8f0;" href="https://aitoolsos.gumroad.com" target="_blank" rel="noopener">Gumroad (LAUNCH25) →</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <input id="practiceName" value="Northstar Behavioral Health" placeholder="Practice Name" oninput="render()" />
          <select id="practiceType" onchange="render()">
            <option>Therapy / Mental Health</option>
            <option>Medical Practice</option>
            <option>Dental Clinic</option>
            <option>HealthTech SaaS</option>
          </select>
        </div>
        <div class="btns" style="margin-top:0;">
          <button onclick="setAll(true)">Check All 15</button>
          <button onclick="setAll(false)">Clear All</button>
        </div>
        <div id="controls"></div>
      </div>

      <div class="card">
        <div class="scorebox">
          <div id="scoreNum" class="scorenum">0</div>
          <div style="font-size:12px;color:var(--muted);">WEIGHTED COMPLIANCE SCORE / 100</div>
          <div id="riskTier" class="tier">CRITICAL</div>
        </div>
        <div id="domains"></div>
        <div class="btns">
          <button class="primary" onclick="downloadMd()">Download Report (.md)</button>
          <button onclick="downloadJson()">Export JSON</button>
          <button onclick="window.print()">Print / PDF</button>
        </div>
        <pre id="reportPre"></pre>
      </div>
    </div>
  </div>

  <script>
    const CONTROLS = [
      { key:'hasEncryptedForms', domain:'Technical', w:8, sev:'Critical', cit:'HIPAA §164.312(e) / GDPR Art.32', q:'Encrypted HTTPS/TLS 1.2+ intake forms', rem:'Enforce HTTPS + HSTS on all intake portals.' },
      { key:'hasAccessControls', domain:'Technical', w:8, sev:'Critical', cit:'HIPAA §164.312(a)', q:'Unique logins & RBAC for patient records', rem:'Remove shared accounts; enforce RBAC.' },
      { key:'hasMfaEnabled', domain:'Technical', w:7, sev:'Critical', cit:'HIPAA §164.312(d)', q:'MFA enforced on EHR & billing portals', rem:'Mandate TOTP/hardware MFA for all staff.' },
      { key:'hasEncryptedEmail', domain:'Technical', w:6, sev:'High', cit:'HIPAA §164.312(e)(2)', q:'Encrypted outbound email / secure portal', rem:'Route PHI via encrypted patient portal.' },
      { key:'hasAuditLogs', domain:'Technical', w:6, sev:'High', cit:'HIPAA §164.312(b) / GDPR Art.30', q:'Immutable access & export audit logs', rem:'Enable append-only audit logs with 6-yr retention.' },
      { key:'hasPrivacyPolicy', domain:'Administrative', w:7, sev:'High', cit:'HIPAA §164.520 / GDPR Art.13', q:'Published Notice of Privacy Practices', rem:'Publish current HIPAA/GDPR notice.' },
      { key:'hasPatientConsent', domain:'Administrative', w:7, sev:'High', cit:'HIPAA §164.508 / GDPR Art.7', q:'Timestamped digital consent forms', rem:'Capture explicit opt-in consent before intake.' },
      { key:'hasStaffTraining', domain:'Administrative', w:6, sev:'Medium', cit:'HIPAA §164.530(b)', q:'Annual HIPAA/GDPR staff training', rem:'Run annual privacy & phishing training.' },
      { key:'hasRetentionPolicy', domain:'Administrative', w:5, sev:'Medium', cit:'GDPR Art.5(1)(e)', q:'Documented retention & erasure schedule', rem:'Purge expired records via cryptographic wipe.' },
      { key:'hasSecureBackup', domain:'Physical & Backup', w:8, sev:'Critical', cit:'HIPAA §164.308(a)(7)', q:'AES-256 offsite immutable backups', rem:'Run daily encrypted backups + monthly restore test.' },
      { key:'hasDeviceEncryption', domain:'Physical & Backup', w:6, sev:'High', cit:'HIPAA §164.310(d)', q:'Full-disk encryption on staff laptops', rem:'Enable BitLocker/FileVault + 5m auto-lock.' },
      { key:'hasFacilityControls', domain:'Physical & Backup', w:6, sev:'Medium', cit:'HIPAA §164.310(a)', q:'Restricted physical records & screen filters', rem:'Lock server/chart rooms; add privacy screens.' },
      { key:'hasDataBreachPlan', domain:'Breach & Vendors', w:7, sev:'Critical', cit:'HIPAA §164.404 / GDPR Art.33', q:'Tested 72-hour Data Breach Response Plan', rem:'Adopt 72h breach containment & notice runbook.' },
      { key:'hasVendorAgreements', domain:'Breach & Vendors', w:7, sev:'Critical', cit:'HIPAA §164.308(b) / GDPR Art.28', q:'Signed BAAs / DPAs with all vendors', rem:'Execute BAAs/DPAs with every sub-processor.' },
      { key:'hasAnnualRiskAssessment', domain:'Breach & Vendors', w:6, sev:'High', cit:'HIPAA §164.308(a)(1)', q:'Annual Security Risk Analysis documented', rem:'Archive baseline assessment & quarterly reviews.' },
    ];
    const state = Object.fromEntries(CONTROLS.map((c, i) => [c.key, i < 6]));

    const ctrlEl = document.getElementById('controls');
    CONTROLS.forEach(c => {
      const label = document.createElement('label');
      label.className = 'ctrl';
      label.innerHTML = `<input type="checkbox" ${state[c.key]?'checked':''} onchange="toggle('${c.key}', this.checked)" /><div><div><span class="tag">${c.domain}</span> <strong>${c.q}</strong></div><div style="font-size:11px;color:#64748b;margin-top:2px;">${c.cit} · Weight ${c.w} · ${c.sev}</div></div>`;
      ctrlEl.appendChild(label);
    });

    function toggle(k, v) { state[k] = v; render(); }
    function setAll(v) {
      CONTROLS.forEach(c => state[c.key] = v);
      document.querySelectorAll('#controls input').forEach(el => el.checked = v);
      render();
    }

    let latestReport = '';
    let latestJson = {};

    function render() {
      const name = document.getElementById('practiceName').value.trim() || 'Your Practice';
      const ptype = document.getElementById('practiceType').value;
      const domains = ['Technical', 'Administrative', 'Physical & Backup', 'Breach & Vendors'];
      let earned = 0, total = 0, passed = 0;
      const gaps = [];
      const domStats = Object.fromEntries(domains.map(d => [d, { e:0, t:0 }]));

      CONTROLS.forEach(c => {
        total += c.w;
        domStats[c.domain].t += c.w;
        if (state[c.key]) { earned += c.w; passed++; domStats[c.domain].e += c.w; }
        else gaps.push(c);
      });

      const score = Math.round((earned / total) * 100);
      const tier = score >= 85 ? 'LOW' : score >= 60 ? 'MEDIUM' : score >= 35 ? 'HIGH' : 'CRITICAL';
      const color = score >= 85 ? '#22c55e' : score >= 60 ? '#f59e0b' : '#ef4444';

      const sEl = document.getElementById('scoreNum');
      sEl.textContent = score;
      sEl.style.color = color;
      const tEl = document.getElementById('riskTier');
      tEl.textContent = `${tier} RISK`;
      tEl.style.background = `${color}22`;
      tEl.style.color = color;

      document.getElementById('domains').innerHTML = domains.map(d => {
        const pct = Math.round((domStats[d].e / domStats[d].t) * 100);
        return `<div class="barwrap"><div class="barlabel"><span>${d}</span><span>${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
      }).join('');

      latestReport = [
        `# HIPAA & GDPR Compliance Audit — ${name}`,
        `Practice Type: ${ptype} | Score: ${score}/100 (${tier} RISK) | Passed: ${passed}/15`,
        '',
        '## Priority Gaps & Citations',
        ...(gaps.length ? gaps.map((g,i) => `${i+1}. [${g.sev}] ${g.cit} — ${g.q}\n   Action: ${g.rem}`) : ['All 15 controls passed!']),
      ].join('\n');
      latestJson = { practiceName: name, practiceType: ptype, score, riskTier: tier, passedCount: passed, gaps };
      document.getElementById('reportPre').textContent = latestReport;
    }

    function downloadMd() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([latestReport], { type:'text/markdown' }));
      a.download = 'compliance-audit-report.md';
      a.click();
    }
    function downloadJson() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(latestJson, null, 2)], { type:'application/json' }));
      a.download = 'compliance-audit-report.json';
      a.click();
    }

    render();
  </script>
</body>
</html>
